<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notice board</title>
<link rel="stylesheet" href="/display/board.css">
<style>
    *, *::before, *::after {
        cursor: none !important;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
        scrollbar-width: none;
    }

    ::-webkit-scrollbar {
        display: none;
    }

    body {
        position: relative;
    }

    #status {
        position: fixed;
        top: 3.8vh;
        left: 4vw;
        z-index: 1;
        display: none;
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
        font-size: 2.6vh;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #ff4438;
    }
</style>
</head>
<body>
<div id="stage"></div>
<div id="status"></div>
<script src="/display/board.js"></script>
<script>
(() => {
    "use strict";

    const params = new URLSearchParams(location.search);
    const pollSeconds = Math.min(300, Math.max(1, Number(params.get("poll")) || 2));
    const keyStorage = "signageboard.displayKey";
    const displayKey = resolveKey();

    const stage = document.getElementById("stage");
    const status = document.getElementById("status");
    const loadedAt = Date.now();
    const reloadClock = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/New_York",
        hour: "numeric",
        minute: "numeric",
        hourCycle: "h23"
    });

    let etag = null;
    let failures = 0;

    function resolveKey() {
        const fromUrl = params.get("key");
        if (fromUrl) {
            try {
                localStorage.setItem(keyStorage, fromUrl);
            } catch (error) {
            }
            params.delete("key");
            const query = params.toString();
            history.replaceState(null, "", location.pathname + (query ? "?" + query : ""));
            return fromUrl;
        }

        try {
            return localStorage.getItem(keyStorage);
        } catch (error) {
            return null;
        }
    }

    async function poll() {
        let problem = null;

        if (!displayKey) {
            problem = "NO DISPLAY KEY";
        } else {
            try {
                const headers = { "X-Display-Key": displayKey };
                if (etag) headers["If-None-Match"] = etag;

                const response = await fetch("/api/board", { headers, cache: "no-store", credentials: "same-origin" });

                if (response.status === 200) {
                    const data = await response.json();
                    etag = response.headers.get("ETag");
                    SignageBoard.render(stage, data);
                    SignageBoard.setScale(stage, data.fontScale || 100);
                } else if (response.status === 404) {
                    problem = "ACCESS DENIED";
                } else if (response.status !== 304) {
                    problem = "OFFLINE";
                }
            } catch (error) {
                problem = "OFFLINE";
            }
        }

        failures = problem ? failures + 1 : 0;
        status.textContent = problem || "";
        status.style.display = problem && (problem !== "OFFLINE" || failures >= 2) ? "block" : "none";
        setTimeout(poll, pollSeconds * 1000);
    }

    function reloadAtFourAm() {
        if (Date.now() - loadedAt < 5 * 60 * 1000) return;

        const parts = reloadClock.formatToParts(new Date());
        const value = type => Number((parts.find(part => part.type === type) || {}).value);

        if (value("hour") === 4 && value("minute") < 5) location.reload();
    }

    SignageBoard.fitToParent(stage);
    setInterval(reloadAtFourAm, 60 * 1000);
    poll();
})();
</script>
</body>
</html>
